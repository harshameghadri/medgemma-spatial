[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medgemma-spatial"
version = "0.1.0"
description = "Spatial transcriptomics analysis with MedGemma foundation models"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Sri Harsha Meghadri"}
]
keywords = ["spatial-transcriptomics", "scanpy", "squidpy", "medgemma", "pathology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/harshameghadri/medgemma-spatial"
Documentation = "https://github.com/harshameghadri/medgemma-spatial/blob/main/README.md"
Repository = "https://github.com/harshameghadri/medgemma-spatial"
"Bug Tracker" = "https://github.com/harshameghadri/medgemma-spatial/issues"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | Loki
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["Loki", "deadcode", "medgemma-spatial", "notebooks"]

[tool.ruff.lint]
# CI gate: correctness-class rules only (syntax errors, undefined names,
# unused imports/variables, mutable defaults). Style is not enforced.
select = ["E9", "F", "B006"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: runs the full spatial pipeline on a synthetic tissue (~1 min)",
    "network: downloads a ~47 MB tiny Gemma 3 test checkpoint from the HF Hub",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/Loki/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
