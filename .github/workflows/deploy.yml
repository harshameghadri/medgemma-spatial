name: Deploy

# Deploys only after the CI workflow has passed on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  huggingface-space:
    name: HuggingFace Space
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Assemble Space tree (same Dockerfile CI built)
        run: |
          set -euo pipefail
          D=/tmp/hf-deploy
          mkdir -p "$D/app" "$D/data"
          cp app/Dockerfile "$D/Dockerfile"
          cp .dockerignore requirements.txt "$D/"
          cp app/streamlit_app.py "$D/app/"
          cp -r src .streamlit "$D/"
          cp data/PanglaoDB_markers_27_Mar_2020.tsv "$D/data/"
          find "$D" -name '__pycache__' -prune -exec rm -rf {} +
          cat > "$D/README.md" <<'READMEEOF'
          ---
          title: MedGemma Spatial Transcriptomics
          emoji: 🔬
          colorFrom: blue
          colorTo: purple
          sdk: docker
          app_port: 8501
          pinned: false
          license: mit
          ---

          # MedGemma Spatial Transcriptomics

          Upload a 10x Visium `.h5ad` file to run spatial analysis and draft a
          MedGemma-generated pathology-style summary.

          **Research use only. Not a medical device; outputs are not clinical advice.**

          Source: https://github.com/harshameghadri/medgemma-spatial
          READMEEOF

      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          pip install --quiet "huggingface_hub>=0.25"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=f"{os.environ['HF_USERNAME']}/medgemma-spatial",
              repo_type="space",
              folder_path="/tmp/hf-deploy",
              commit_message=f"deploy: {os.environ['SHA'][:7]} from GitHub Actions",
              delete_patterns=["*"],
          )
          PY

  vercel:
    name: Vercel portfolio page
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret not configured; skipping Vercel deploy."
            exit 0
          fi
          npx --yes vercel@latest --prod --token="$VERCEL_TOKEN" --cwd vercel/
