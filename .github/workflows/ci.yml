name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check src app scripts tests

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan full history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lock that Docker ships.
          - python-version: "3.12"
            deps: requirements.txt
          # Latest releases within requirements.in ranges, to catch upstream breakage early.
          - python-version: "3.12"
            deps: requirements.in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.deps }}
            requirements-dev.txt
      - name: Install runtime + dev dependencies
        run: >-
          pip install -r ${{ matrix.deps }} -r requirements-dev.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Dependency consistency
        run: pip check
      - name: Run tests
        run: pytest -v

  lora:
    name: LoRA training smoke (tiny Gemma 3, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements-train.txt
            requirements-dev.txt
      # Resolved together (not against the runtime lock), as on Kaggle where the
      # training pins are installed into an existing environment.
      - name: Install runtime ranges + training pins + dev dependencies
        run: >-
          pip install -r requirements.in -r requirements-train.txt -r requirements-dev.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Train 2 steps, check loss masking, load adapter for inference
        run: |
          set -o pipefail
          pytest -v -rs tests/test_lora.py tests/test_inference.py | tee pytest.log
          if grep -q SKIPPED pytest.log; then echo "::error::LoRA tests were skipped"; exit 1; fi

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Audit locked requirements
        run: |
          ignores=$(grep -oE '^(GHSA|PYSEC|CVE)-[^ ]+' audit-ignore.txt | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          pip-audit -r requirements.txt --disable-pip --no-deps --progress-spinner off $ignores
      - name: Audit training requirements
        run: pip-audit -r requirements-train.txt --disable-pip --no-deps --progress-spinner off

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test, lora]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          push: false
          load: true
          tags: medgemma-spatial:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name app -p 8501:8501 medgemma-spatial:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then echo; break; fi
            sleep 2
          done
          docker exec app python -c "import src.streamlit_adapter, transformers.models.gemma3"
          curl -fsS http://localhost:8501/_stcore/health
          docker logs app
